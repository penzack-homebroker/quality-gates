name: 🚀 Quality Gate (reusable)

# Workflow reutilizável — os projetos chamam com:
#   uses: penzack-homebroker/quality-gates/.github/workflows/quality-gate.yml@v0.4.0
# Ver README para o exemplo completo de adoção.

on:
  workflow_call:
    inputs:
      node-version-file:
        description: 'Arquivo com a versão do Node (padrão .nvmrc)'
        type: string
        default: '.nvmrc'
      pr-title-pattern:
        description: 'Regex (grep -iE, case-insensitive) que o título do PR deve satisfazer'
        type: string
        default: '^(test|fix|feat|chore|refactor|sync|deploy|hotfix)'
      timezone:
        description: 'Timezone do runner (testes sensíveis a data/hora)'
        type: string
        default: 'America/Sao_Paulo'
      run-pr-title:
        description: 'Desligue quando o projeto tem validador de título próprio'
        type: boolean
        default: true
      run-typecheck:
        type: boolean
        default: true
      run-dup:
        type: boolean
        default: true
      run-knip:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        description: 'Token de leitura do GitHub Packages (@penzack-homebroker). Opcional: sem ele o job usa o GITHUB_TOKEN do repositório chamador, que basta quando o pacote concede acesso ao repo em "Manage Actions access".'
        required: false

jobs:
  pr-title:
    name: 🏷️ PR Title
    if: github.event_name == 'pull_request' && inputs.run-pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PATTERN: ${{ inputs.pr-title-pattern }}
        run: |
          # espaços nas bordas são invisíveis na UI do GitHub, mas quebram o ^ do regex
          TITLE="$(echo "$PR_TITLE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          if echo "$TITLE" | grep -qiE "$PATTERN"; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must match '$PATTERN' (case-insensitive, whitespace-trimmed). Got: '$TITLE'"
            exit 1
          fi

  quality:
    name: ✅ Typecheck, Lint, Duplication, Dead Code & Tests
    runs-on: ubuntu-latest
    # Os projetos versionam um `.npmrc` com `//npm.pkg.github.com/:_authToken=${NPM_TOKEN}` para o
    # pacote privado @penzack-homebroker/platform-kit. O Yarn 1 interpola essa variável em TODO
    # comando, então ela fica no escopo do job inteiro (install, lint, testes...).
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: yarn

      - name: 📦 Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🌐 Set timezone
        run: sudo timedatectl set-timezone ${{ inputs.timezone }}

      - name: 🧮 Type Check
        if: inputs.run-typecheck
        run: yarn typecheck

      - name: 🧹 Lint (baseline em eslint-suppressions.json — violação nova falha)
        run: yarn lint

      - name: 👯 Code Duplication (jscpd, threshold ratchet)
        if: inputs.run-dup
        run: yarn dup

      - name: 💀 Dead Code — unused dependencies (knip)
        if: inputs.run-knip
        run: yarn knip

      - name: 💀 Dead Code — full report (não-bloqueante)
        if: inputs.run-knip
        run: yarn knip:full
        continue-on-error: true

      - name: ✅ Run Unit Tests
        if: inputs.run-tests
        run: yarn test
