name: ✅ Sentry Resolve (reusable)

# Fecha o ciclo: quando um PR `fix/sentry-<id>-*` é mergeado, o issue correspondente fica
# "resolvido na próxima release" no Sentry, com nota apontando para o PR. Os fronts chamam com:
#   on: pull_request: { types: [closed] }
#   if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'fix/sentry-')
#   uses: penzack-homebroker/quality-gates/.github/workflows/sentry-resolve.yml@v0.5.0

on:
  workflow_call:
    inputs:
      head_ref:
        type: string
        required: true
      base_ref:
        type: string
        default: 'develop'
      pr_url:
        type: string
        required: true
      sentry_org:
        type: string
        default: 'penzack'
    secrets:
      SENTRY_ACCESS_TOKEN:
        required: true

jobs:
  resolve:
    name: ✅ ${{ inputs.head_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Scripts (mesma versão deste workflow)
        uses: actions/checkout@v4
        with:
          repository: penzack-homebroker/quality-gates
          ref: ${{ github.job_workflow_sha }}
          path: .quality-gates

      - name: 🗒️ Resolver issue no Sentry
        env:
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_REF: ${{ inputs.base_ref }}
          PR_URL: ${{ inputs.pr_url }}
          SENTRY_ORG: ${{ inputs.sentry_org }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_ACCESS_TOKEN }}
        run: node .quality-gates/scripts/sentry-triage/resolve-issue.mjs
